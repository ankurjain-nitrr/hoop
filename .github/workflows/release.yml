name: Release

# Pushing a tag vX.Y.Z on main stages that version on npm with provenance and creates its GitHub
# Release with the changelog section and the package tarball. docs/RELEASING.md
# describes the steps and the first-time setup.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Type check, lint, tests and acceptance run (Node 22, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in a release: a poisoned cache would ship.
          package-manager-cache: false
      - run: npm ci
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $version"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          HOOP_REQUIRE_BROWSER: "1"
          HOOP_CHROME: /usr/bin/google-chrome
      # tsx from the lockfile's install; npx could fetch a package the lockfile doesn't pin.
      - run: node_modules/.bin/tsx scripts/e2e-local.ts
        env:
          HOOP_CHROME: /usr/bin/google-chrome

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Signs the provenance statement, and lets npm trusted publishing authenticate this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in a release: a poisoned cache would ship.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Staged publishing through trusted publishing needs npm 11.15 or later; Node 22 ships npm 10.
      # That npm runs from its registry tarball, checked against the integrity npm's registry lists
      # for it, with nothing installed globally.
      - name: Fetch npm 11.21.0 and check its integrity
        env:
          TARBALL: https://registry.npmjs.org/npm/-/npm-11.21.0.tgz
          INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
        run: |
          curl -sSfL -o "$RUNNER_TEMP/npm.tgz" "$TARBALL"
          actual="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm.tgz" | base64 -w0)"
          if [ "$actual" != "$INTEGRITY" ]; then
            echo "::error::npm's tarball doesn't match its pinned integrity"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/npm"
          tar -xzf "$RUNNER_TEMP/npm.tgz" -C "$RUNNER_TEMP/npm" --strip-components=1
      - run: npm ci
      # npm authenticates this workflow through its id-token (trusted publishing), so no token is
      # stored anywhere. The version is staged, not published: it goes live only when a maintainer
      # approves it under Staged Packages on npmjs.com, with two-factor authentication.
      - run: node "$RUNNER_TEMP/npm/bin/npm-cli.js" stage publish --access public

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in a release: a poisoned cache would ship.
          package-manager-cache: false
      # The same tarball npm staged, so the Release carries exactly what npm publishes once approved.
      - run: npm ci && npm pack
      - name: Create the release with this version's changelog section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md ./*.tgz

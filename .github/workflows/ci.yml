name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s plugins/devloop/skills/writing-style/scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s plugins/devloop/skills/oss-practices/scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s plugins/devloop/skills/project-docs/scripts -p 'test_*.py'

  browser:
    name: Browser tests (Node 22, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          HOOP_REQUIRE_BROWSER: "1"
          HOOP_CHROME: /usr/bin/google-chrome

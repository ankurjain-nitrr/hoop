name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The job names are main's required checks. The suite runs once per Node version: on Node 22 with
# Chrome, on Node 24 without it. Tests start hoop's processes from the build that npm ci makes (its
# prepare script), not through tsx (HOOP_TEST_BUILT). Without the browser, six test files run at
# once on the four CPUs, since most of their time is spent waiting on child processes and timers;
# with Chrome, which keeps the CPUs busy, four.
jobs:
  check:
    name: Type check, lint and tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # publint on the package as npm would publish it.
      - run: npm run check:package
      # Fails when a change adds import cycles or unused, complex, loosely typed or duplicated code
      # beyond debt-baseline.json, or raises the baseline above the base branch's. On main a fall in
      # debt only warns: two merged pull requests can each record the same fall.
      - name: Debt ratchet
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git fetch --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            npm run debt -- --base "origin/$BASE_REF"
          else
            npm run debt -- --allow-falls
          fi

  browser:
    name: Browser tests (Node 22, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test --test-concurrency=4 test/*.test.ts
        env:
          HOOP_TEST_BUILT: "1"
          HOOP_REQUIRE_BROWSER: "1"
          HOOP_CHROME: /usr/bin/google-chrome
      # Anything a test left running, which the runner then has to stop.
      - name: Leftover processes
        if: always()
        run: ps -eo pid,etime,args | grep -E 'node|chrome' | grep -v grep || true

  node24:
    name: Type check, lint and tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx tsx --test --test-concurrency=6 test/*.test.ts
        env:
          HOOP_TEST_BUILT: "1"
          HOOP_SKIP_BROWSER: "1"
      - name: Leftover processes
        if: always()
        run: ps -eo pid,etime,args | grep -E 'node|chrome' | grep -v grep || true

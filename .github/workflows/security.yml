name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 05:17 UTC.
    - cron: "17 5 * * 1"

permissions: {}

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Security scans. None of these jobs is a required check, so a finding never blocks a merge: each
# tool reports to the Security tab (code scanning) through a SARIF upload, and gitleaks, which the
# Security tab can't show well, fails its own job instead. Scorecard runs only on main and the
# schedule, as its results API requires; its job follows ossf/scorecard-action's documented workflow.
jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # Reads the workflow run, which the SARIF upload needs.
      contents: read # Reads the code it scans.
      security-events: write # Uploads the results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Reads the commits it scans.
      pull-requests: read # Lists a pull request's commits, which are the ones it scans.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans the pushed or pull request commits, and the whole history on the schedule.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"

  osv-scanner:
    name: osv-scanner
    permissions:
      actions: read # Reads the workflow run, which the SARIF upload needs.
      contents: read # Reads the code it scans.
      security-events: write # Uploads the results to code scanning.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --lockfile=package-lock.json
      fail-on-vuln: false

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Reads the workflow run, which the SARIF upload needs.
      contents: read # Reads the code it scans.
      security-events: write # Uploads the results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Reads the repository it scores.
      security-events: write # Uploads the results to code scanning.
      id-token: write # Signs the results it publishes to the Scorecard API, which the badge reads.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

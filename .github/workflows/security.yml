name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 05:17 UTC.
    - cron: "17 5 * * 1"

permissions: {}

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Security scans. None of these jobs is a required check, so a finding never blocks a merge: each
# tool reports to the Security tab (code scanning) through a SARIF upload, except gitleaks, which the
# Security tab can't show well and which fails its own job instead, and the license check, which
# warns. Scorecard runs only on main and the schedule, as its results API requires; its job follows
# ossf/scorecard-action's documented workflow.
jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # Reads the workflow run, which the SARIF upload needs.
      contents: read # Reads the code it scans.
      security-events: write # Uploads the results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Reads the commits it scans.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # A pull request's own commits; a push's commits, including those a merge brings in; the whole
      # history on the schedule, for a new branch, and when the push's old head is gone (a force push).
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          range=
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          fi
          echo "Scanning ${range:-the whole history}"
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --config .gitleaks.toml ${range:+"--log-opts=$range"}

  osv-scanner:
    name: osv-scanner
    permissions:
      actions: read # Reads the workflow run, which the SARIF upload needs.
      contents: read # Reads the code it scans.
      security-events: write # Uploads the results to code scanning.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --lockfile=package-lock.json
      fail-on-vuln: false

  # Lists each dependency whose license isn't one of these permissive ones, compatible with
  # Apache-2.0, in the job summary and as a warning. Code scanning doesn't take license results.
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Reads the lockfile it checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scan
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --licenses=MIT,ISC,Apache-2.0,BSD-2-Clause,BSD-3-Clause,0BSD,BlueOak-1.0.0,CC0-1.0
            --format=markdown
            --output=licenses.md
      - name: Report
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          cat licenses.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then
            echo "::warning::Some dependencies have a license outside the allowlist; see the job summary."
          fi

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    permissions:
      actions: read # Reads the workflow run, which the SARIF upload needs.
      contents: read # Reads the code it scans.
      security-events: write # Uploads the results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without --error, findings don't fail the job; they go to code scanning.
      - run: >-
          semgrep scan --metrics=off --config p/default --config p/typescript --config p/nodejs
          --exclude web/vendor --sarif-output=semgrep.sarif .
      # Code scanning ignores SARIF suppressions, so this drops the results marked nosemgrep.
      - name: Drop suppressed results
        run: |
          python3 - <<'EOF'
          import json
          with open("semgrep.sarif") as f:
              sarif = json.load(f)
          for run in sarif["runs"]:
              run["results"] = [r for r in run["results"] if not r.get("suppressions")]
          with open("semgrep.sarif", "w") as f:
              json.dump(sarif, f)
          EOF
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Reads the workflow run, which the SARIF upload needs.
      contents: read # Reads the code it scans.
      security-events: write # Uploads the results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Reads the repository it scores.
      security-events: write # Uploads the results to code scanning.
      id-token: write # Signs the results it publishes to the Scorecard API, which the badge reads.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

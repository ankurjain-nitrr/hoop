<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hoop</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="banner" role="status"></div>
<div id="app"><p class="empty">Loading…</p></div>
<script type="module">
  // The app loads through a dynamic import, so a module that fails to load shows its error here.
  const app = document.getElementById("app");
  let started = false;
  const fail = (why) => {
    const p = document.createElement("p");
    p.className = "empty";
    p.setAttribute("role", "alert");
    p.textContent = `The page couldn't start: ${why}. Stop hoop's pages process, and any hoop command starts the current one.`;
    app.replaceChildren(p);
  };
  // A page still on "Loading" after five seconds shows why, whether its code or its data is late.
  setTimeout(() => { if (!started && app.textContent === "Loading…") fail("it didn't load within five seconds"); }, 5000);
  Promise.all([import("/app.js"), import("/review.js"), import("/select.js"), import("/trail.js")])
    .then(([{ start }]) => start().then(() => { started = true; }))
    .catch((err) => { started = true; fail(err.message); });
</script>
</body>
</html>
